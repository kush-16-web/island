<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Island Live Voice Assistant UI Verification (Pass 2.2.8.4)</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #090a0f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    /* Dynamic Theme Hub Window - preserving authentic purple/pink artwork tint */
    .island-app-shell {
      --voice-accent: #c084fc;
      --music-accent: #c084fc;
      --accent: #c084fc;
      --fill-1: rgba(255, 255, 255, 0.04);
      --fill-2: rgba(255, 255, 255, 0.07);
      --fill-3: rgba(255, 255, 255, 0.12);
      --hair: rgba(255, 255, 255, 0.08);
      --hair-2: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --text-2: rgba(255, 255, 255, 0.72);
      --text-3: rgba(255, 255, 255, 0.44);
      --c-alarm: #f43f5e;
      --c-timer: #f59e0b;
      --c-info: #c084fc;
      width: 460px;
      height: 480px;
      background: radial-gradient(130% 130% at 50% -10%, rgba(126, 34, 206, 0.42) 0%, rgba(20, 14, 34, 0.97) 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 24px;
      backdrop-filter: blur(32px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .seg__btn {
      padding: 0 8.5px;
      font-size: 11.5px;
    }
    .live-history-turn {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      margin-bottom: 6px;
    }
    .live-history-turn.is-user {
      background: rgba(192, 132, 252, 0.08);
      border-left: 2px solid var(--voice-accent, #c084fc);
    }
    .live-history-turn__header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10.5px;
      color: var(--text-3);
    }
    .live-history-turn__speaker {
      font-weight: 600;
      color: var(--text-2);
    }
    .live-history-turn__content {
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
    }
  </style>
</head>
<body class="theme-dark">
  <div class="island-app-shell" id="app-shell">
    <div class="hub">
      <!-- Fixed Top Navigation (Section A) -->
      <div class="hub__head">
        <div class="hub__nav">
          <div class="seg" role="tablist" aria-label="Island sections">
            <button type="button" class="seg__btn" role="tab" aria-selected="false">
              <span class="seg__label">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
              </span>
            </button>
            <button type="button" class="seg__btn" role="tab" aria-selected="false">
              <span class="seg__label">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="18" r="4"/><path d="M12 18V2l7 4"/></svg>
                Playing
              </span>
            </button>
            <button type="button" class="seg__btn" role="tab" aria-selected="false">
              <span class="seg__label">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-3a5 5 0 0 1 5-5z"/></svg>
                Pet
              </span>
            </button>
            <button type="button" class="seg__btn" role="tab" aria-selected="false">
              <span class="seg__label">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Clock
              </span>
            </button>
            <button type="button" class="seg__btn" role="tab" aria-selected="false">
              <span class="seg__label">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                Inbox
              </span>
            </button>
          </div>
        </div>
        <div class="hub__actions">
          <button type="button" class="hub-action-btn" title="Settings" aria-label="Settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button type="button" class="hub-voice-btn is-active is-selected" title="Voice Companion" aria-label="Voice Companion">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            <span class="hub-voice-pulse is-listening" id="hub-mic-pulse"></span>
          </button>
        </div>
      </div>

      <!-- Hub Body hosting Live Assistant Screen (Section B & C) -->
      <div class="hub__body">
        <div class="live-assistant-panel" id="live-panel">
          <!-- 1. Activity Header with Minimal 4-Bar Indicator -->
          <div class="live-assistant__header">
            <div class="live-assistant__status-group">
              <div class="live-voice-indicator state--listening" id="live-indicator">
                <span class="live-voice-bar bar--1" style="height: 6px;"></span>
                <span class="live-voice-bar bar--2" style="height: 12px;"></span>
                <span class="live-voice-bar bar--3" style="height: 9px;"></span>
                <span class="live-voice-bar bar--4" style="height: 5px;"></span>
              </div>
              <div class="live-assistant__status-meta">
                <span class="live-assistant__status-label" id="live-status-label">Listening</span>
                <span class="live-assistant__query-preview" id="live-query-preview">"Set a timer for five minutes so I can get lunch"</span>
              </div>
            </div>
            <div class="live-assistant__header-actions">
              <button type="button" class="live-assistant__icon-btn" title="Minimize assistant">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
          </div>

          <!-- 2. Live Surface / Hero View -->
          <div class="live-assistant__surface" id="live-surface">
            <!-- Dynamically injected per state -->
          </div>

          <!-- 3. Fixed Bottom Session Controls (Section C) -->
          <div class="live-assistant__controls" id="live-controls">
            <div class="live-assistant__controls-left">
              <button type="button" class="live-ctl-btn live-ctl-btn--subtle" id="history-toggle-btn" title="View conversation history">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                <span>History</span>
              </button>
            </div>
            <div class="live-assistant__controls-right">
              <button type="button" class="live-ctl-btn live-ctl-btn--subtle" id="mute-btn" title="Mute microphone">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                <span>Mute</span>
              </button>
              <button type="button" class="live-ctl-btn live-ctl-btn--danger" id="end-btn" title="End voice session">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                <span>End</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State switcher utilities for visual screenshot captures
    window.setAssistantState = function(stateName, payload = {}) {
      const indicator = document.getElementById('live-indicator');
      const label = document.getElementById('live-status-label');
      const preview = document.getElementById('live-query-preview');
      const surface = document.getElementById('live-surface');
      const appShell = document.getElementById('app-shell');
      const micPulse = document.getElementById('hub-mic-pulse');

      // Reset indicators
      indicator.className = 'live-voice-indicator state--' + (payload.indicatorState || stateName);
      if (micPulse) micPulse.className = 'hub-voice-pulse is-' + stateName;
      if (payload.bars) {
        const barEls = indicator.querySelectorAll('.live-voice-bar');
        payload.bars.forEach((h, i) => { if (barEls[i]) barEls[i].style.height = h + 'px'; });
      }

      label.textContent = payload.label || stateName;
      preview.textContent = payload.query ? `"${payload.query}"` : '';

      // Default height
      appShell.style.height = payload.windowHeight || '460px';

      // Inject HTML
      surface.innerHTML = payload.surfaceHtml || '';
    };
  </script>
</body>
</html>
